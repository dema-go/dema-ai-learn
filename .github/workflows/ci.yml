name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests (fixture model, no real API calls)
        run: python -m pytest tests/ -q
        env:
          DEEPSEEK_API_KEY: ""

  prototypes:
    name: Prototype verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run prototype tests
        run: python -m unittest tests/test_miniprogram_ui.py tests/test_prototypes.py -v

  miniprogram:
    name: Miniprogram typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run miniprogram state tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  diff-check:
    name: Whitespace / diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main --depth=1
      - name: git diff --check against main
        run: git diff --check origin/main...HEAD
